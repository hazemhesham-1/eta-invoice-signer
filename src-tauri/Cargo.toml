[package]
name = "app"
version = "1.0.0"
description = "Official IWOMT desktop companion application for secure signing and submission of invoices to the Egyptian Tax Authority (ETA) portal."
authors = ["Hazem Hesham"]
license = "UNLICENSED"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
cryptoki = "0.12.0"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.13.0"
tauri-plugin-dialog = "2.8.3"
